name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Run TypeScript checks
        run: npm run lint

      - name: Run download and model manager tests
        run: npm run test:downloads

      - name: Run runtime tests
        run: npm run test:runtime

      - name: Run IPC tests
        run: npm run test:ipc

      - name: Run UI tests
        run: npm run test:ui

      - name: Run audio and voice tests
        run: npm run test:fx

  build-windows:
    name: Build Windows
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Build Windows installer
        run: npm run dist:win

      - name: Verify output
        shell: pwsh
        run: |
          if (!(Test-Path "release/windows")) {
            throw "release/windows was not created."
          }
          $files = Get-ChildItem "release/windows" -File -Recurse
          if ($files.Count -eq 0) {
            throw "No Windows installer files were generated."
          }
          $files | Select-Object FullName, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/windows/
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build macOS
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Build macOS installers
        run: npm run dist:mac

      - name: Verify output
        shell: bash
        run: |
          test -d release/macos || {
            echo "::error::release/macos was not created."
            exit 1
          }
          find release/macos -type f -print -quit | grep -q . || {
            echo "::error::No macOS installer files were generated."
            exit 1
          }
          find release/macos -type f -print

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/macos/
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Build Linux
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libdrm2 \
            libxkbcommon-dev \
            libgbm-dev \
            libasound2-dev

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Build Linux installers
        run: npm run dist:linux

      - name: Verify output
        shell: bash
        run: |
          test -d release/linux || {
            echo "::error::release/linux was not created."
            exit 1
          }
          find release/linux -type f -print -quit | grep -q . || {
            echo "::error::No Linux installer files were generated."
            exit 1
          }
          find release/linux -type f -print

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/linux/
          if-no-files-found: error
          retention-days: 30

  build-summary:
    name: Build Summary
    needs:
      - test
      - build-windows
      - build-macos
      - build-linux
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Report results
        shell: bash
        env:
          TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
        run: |
          echo "Test: $TEST_RESULT"
          echo "Windows: $WINDOWS_RESULT"
          echo "macOS: $MACOS_RESULT"
          echo "Linux: $LINUX_RESULT"

          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "::error::Tests failed. Check the first failed step in the Test Application job."
            exit 1
          fi

          if [[ "$WINDOWS_RESULT" != "success" ||
                "$MACOS_RESULT" != "success" ||
                "$LINUX_RESULT" != "success" ]]; then
            echo "::error::One or more installer builds failed or were skipped."
            exit 1
          fi

          echo "All tests and platform builds succeeded."

  release:
    name: Publish GitHub Release
    needs:
      - test
      - build-windows
      - build-macos
      - build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: release/windows/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: release/macos/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: release/linux/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/**/*
            release/macos/**/*
            release/linux/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
          generate_release_notes: true
